[project]
name = "fastapi-template"
version = "1.1.0"
description = "Scalable async FastAPI backend template"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.14.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "slowapi>=0.1.9",
    "structlog>=25.4",
    "prometheus-fastapi-instrumentator>=7.1",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.16.8",
    "mypy>=1.13",
    "pre-commit>=4.6.1",
    "git-cliff>=2.14.2",
    "pip-audit>=2.7",
    "testcontainers[postgres]>=4.9",
]

[project.scripts]
fastapi-template = "app.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "RUF",
    "S",
    "PT",
    "DTZ",
    "PTH",
    "RET",
    "ARG",
]

[tool.ruff.lint.per-file-ignores]
# Bare `assert` is pytest's normal mechanism, and fixtures/fakes routinely take
# arguments they don't use (setup side effects, protocol conformance) or build
# fake credentials as plain strings.
"tests/*" = ["S101", "S105", "S106", "S107", "ARG001", "ARG002"]
# Deferred: PT011/PT018/PT022 are real, tiny, mechanical fixes, but the files
# they live in are outside this task's scope (tests/unit/fakes.py, pyproject.toml
# only) — follow-up, not a rule design choice.
"tests/unit/test_bootstrap.py" = ["PT018"]
"tests/unit/test_local_storage.py" = ["PT011"]
"tests/integration/test_attachment_routes.py" = ["PT022"]
# `request`/event-listener params required by slowapi's rate limiter and
# SQLAlchemy's event hooks even when unused; fixing means touching app/, which
# is out of scope for this task.
"app/api/v1/routes/auth.py" = ["ARG001"]
"app/api/v1/routes/users.py" = ["ARG001"]
"app/core/audit/listeners.py" = ["ARG001"]
"app/core/http/rate_limit.py" = ["ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=app"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this template. Generated from Conventional Commits with [git-cliff](https://git-cliff.org). Clear this file when you start a project from the template.
"""
body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor -%}
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Tests" },
    { message = "^docs", group = "Documentation" },
    { message = "^(chore|style)", group = "Miscellaneous" },
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
