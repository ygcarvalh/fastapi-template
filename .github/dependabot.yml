version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Tooling never reaches production, so a single PR per week is enough.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Runtime patches ship together; majors and minors stay separate so a
      # breaking change is never buried in a batch.
      runtime-patches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      base-images:
        patterns: ["*"]
