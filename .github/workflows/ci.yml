name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: fastapi_user
  POSTGRES_PASSWORD: secret123

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastapi_user
          POSTGRES_PASSWORD: secret123
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastapi_user -d fastapi_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://fastapi_user:secret123@localhost:5432/fastapi_db
      TEST_DATABASE_URL: postgresql+asyncpg://fastapi_user:secret123@localhost:5432/fastapi_db_test
      SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create the test database
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" createdb \
            -h localhost -U "$POSTGRES_USER" fastapi_db_test

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest --cov

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check commit subjects are Conventional Commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-commit-messages.sh "$BASE_SHA..HEAD"
