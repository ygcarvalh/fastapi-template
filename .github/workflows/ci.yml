name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: fastapi_user
  POSTGRES_PASSWORD: secret123

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastapi_user
          POSTGRES_PASSWORD: secret123
          POSTGRES_DB: fastapi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastapi_user -d fastapi_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://fastapi_user:secret123@localhost:5432/fastapi_db
      TEST_DATABASE_URL: postgresql+asyncpg://fastapi_user:secret123@localhost:5432/fastapi_db_test
      SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create the test database
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" createdb \
            -h localhost -U "$POSTGRES_USER" fastapi_db_test

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest --cov

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check CHANGELOG.md is up to date
        run: |
          uv run git-cliff --output /tmp/CHANGELOG.generated.md
          diff -u CHANGELOG.md /tmp/CHANGELOG.generated.md
