name: fastapi-template

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fastapi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret123}
      POSTGRES_DB: ${POSTGRES_DB:-fastapi_db}
    # Loopback only: the database has one client on this machine, and a
    # default password must not answer on the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastapi_user} -d ${POSTGRES_DB:-fastapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fastapi_user}:${POSTGRES_PASSWORD:-secret123}@db:5432/${POSTGRES_DB:-fastapi_db}
      SECRET_KEY: "${SECRET_KEY:?generate one with openssl rand -hex 32}"
      SERVICE_NAME: ${SERVICE_NAME:-fastapi-template}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      REQUEST_LOG_PERSIST_ENABLED: ${REQUEST_LOG_PERSIST_ENABLED:-true}
      FEATURE_FLAGS: ${FEATURE_FLAGS:-items,request-log,audit-log}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      # Which proxies uvicorn believes about X-Forwarded-For. Empty means
      # none, so a caller cannot pick its own IP for the rate limiter or the
      # request log. Set it to your reverse proxy's address in production.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
    # Lets the shared devstack read this container's stdout. Harmless without it.
    labels:
      devstack.service: ${SERVICE_NAME:-fastapi-template}
    ports:
      - "${API_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  # An interactive psql against db: docker compose run --rm psql
  # Behind a profile so that docker compose up does not start it.
  psql:
    image: postgres:17-alpine
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-fastapi_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-secret123}
      PGDATABASE: ${POSTGRES_DB:-fastapi_db}
    entrypoint: ["psql"]

volumes:
  postgres_data:
