repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: commit-message
        name: conventional commit subject
        entry: scripts/check-commit-messages.sh
        language: script
        stages: [commit-msg]
      - id: mypy
        name: mypy
        entry: uv run mypy app tests
        language: system
        types: [python]
        pass_filenames: false
      # On push rather than on commit: the suite runs against a real database,
      # which is too slow to pay for on every commit and too important to leave
      # to whoever remembers. With no CI, this is the only thing that runs it.
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      # Runs when the locked dependency set changes, so a bump that pulls in
      # an advisory is refused at the push rather than found at the release.
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [pre-push]
